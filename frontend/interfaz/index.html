<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-VER Spectre Identifier</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <!--
    MOD-01 · Interfaz web (incremento 1, T-06).
    Solo sube el archivo y muestra el veredicto. No sabe de tamaños, formatos,
    puntos ni rangos: esos valores viven en UT-03 y los aplica el servidor
    (MOD-02 y MOD-03). Por eso el selector no tiene «accept=...»: escribir aquí
    la lista de formatos sería repetir UT-03.
  -->
  <main class="pagina">
    <header class="encabezado">
      <h1>E-VER Spectre Identifier</h1>
      <p class="subtitulo">Suba su espectro infrarrojo para revisarlo antes del análisis.</p>
    </header>

    <form id="formulario" class="tarjeta" novalidate>
      <label class="etiqueta" for="archivo">Archivo del espectro</label>
      <input id="archivo" name="archivo" type="file">
      <button id="boton-validar" class="boton boton-principal" type="submit" disabled>
        Validar archivo
      </button>
    </form>

    <section id="resultado" class="tarjeta resultado" data-estado="inicial"
             aria-live="polite" hidden>
      <h2 id="resultado-titulo" class="resultado-titulo"></h2>
      <p id="resultado-nombre" class="resultado-nombre"></p>
      <p id="resultado-mensaje" class="resultado-mensaje"></p>
      <p id="resultado-accion" class="resultado-accion"></p>
    </section>

    <!-- Incremento 2: la gráfica de MOD-05. Solo aparece cuando el archivo
         se aprobó y MOD-04 lo procesó; con un rechazo se borra y se oculta. -->
    <section id="grafica" class="tarjeta grafica" hidden>
      <h2 class="grafica-titulo">Espectro</h2>
      <div id="grafica-lienzo" class="grafica-lienzo"></div>
      <ul id="grafica-leyenda" class="grafica-leyenda" hidden></ul>
    </section>

    <!-- «Analizar» se habilita al aprobar el archivo. Desde el incremento 3
         manda el espectro procesado al motor y muestra los grupos. -->
    <button id="boton-analizar" class="boton boton-analizar" type="button" disabled>
      Analizar
    </button>

    <section id="analisis" class="tarjeta analisis" data-estado="inicial"
             aria-live="polite" hidden>
      <h2 id="analisis-titulo" class="analisis-titulo"></h2>
      <p id="analisis-mensaje" class="analisis-mensaje" hidden></p>
      <p id="analisis-accion" class="analisis-accion" hidden></p>
      <ol id="analisis-lista" class="analisis-lista"></ol>
      <!-- Incremento 5: el reporte PDF del análisis. -->
      <button id="boton-reporte" class="boton boton-reporte" type="button" hidden>
        Descargar reporte
      </button>
      <div id="reporte-estado" class="reporte-estado" aria-live="polite" hidden>
        <p id="reporte-mensaje" class="reporte-mensaje"></p>
        <p id="reporte-accion" class="reporte-accion"></p>
      </div>
    </section>
  </main>

  <script src="../visor-espectro/libreria/chart.umd.js"></script>
  <script src="../visor-espectro/visor.js"></script>
  <script src="../servicios/validacion.js"></script>
  <script src="../servicios/analisis.js"></script>
  <script src="../servicios/reporte.js"></script>
  <script src="interfaz.js"></script>
</body>
</html>
