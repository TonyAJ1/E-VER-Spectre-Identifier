; Configuracion de pytest. Las pruebas viven en backend/pruebas/ (RNF-06) y usan
; nombres en espanol, igual que el resto del repositorio.
[pytest]
testpaths = backend/pruebas motor_identificacion/pruebas
python_files = prueba_*.py
python_functions = prueba_*
python_classes = Prueba*
pythonpath = .
addopts = -v
